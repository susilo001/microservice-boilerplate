receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  # Drop spans/metrics that exceed memory budget before they are exported.
  memory_limiter:
    check_interval: 1s
    limit_mib: 512
    spike_limit_mib: 128

  # Batch signals for efficiency — reduces exporter round-trips.
  batch:
    send_batch_size: 512
    timeout: 5s

exporters:
  # Development: print to stdout. Replace with a real backend for production.
  # Examples:
  #   otlphttp/jaeger:
  #     endpoint: http://jaeger:4318
  #   prometheus:
  #     endpoint: 0.0.0.0:8888
  debug:
    verbosity: detailed

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [debug]
    metrics:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [debug]
