info:
  contact:
    email: susiloodie@gmail.com
  description: Clean Architecture Go microservice for product management.
  title: Product Microservice API
  version: "1.0"
paths:
  /api/v1/products:
    get:
      description: Returns a paginated list of products. Filters use field:operator:value;
        sort uses field:direction.
      parameters:
      - description: Page number (default 1)
        in: query
        name: page
        type: integer
      - description: Items per page (default 20)
        in: query
        name: page_size
        type: integer
      - description: Substring search across name and description
        in: query
        name: search
        type: string
      - description: 'Repeatable filter: name:eq:Widget, price:gte:10, stock:lte:50'
        in: query
        name: filter
        type: string
      - description: 'Sort: name:asc, price:desc, stock:asc, created_at:desc, updated_at:desc'
        in: query
        name: sort
        type: string
      - description: Comma-separated relations to eager-load
        in: query
        name: preload
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_boilerplate_microservice-boilerplate_api_http_v1_response.APIResponse-github_com_boilerplate_microservice-boilerplate_api_http_v1_response_ListData-github_com_boilerplate_microservice-boilerplate_internal_product_domain_response_ProductResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/github_com_boilerplate_microservice-boilerplate_api_http_v1_response.APIResponse-github_com_boilerplate_microservice-boilerplate_api_http_v1_response_Empty'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/github_com_boilerplate_microservice-boilerplate_api_http_v1_response.APIResponse-github_com_boilerplate_microservice-boilerplate_api_http_v1_response_Empty'
      summary: List products
      tags:
      - products
    post:
      consumes:
      - application/json
      description: Creates a new product and publishes a ProductCreated event.
      parameters:
      - description: Product payload
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/github_com_boilerplate_microservice-boilerplate_internal_product_domain_request.CreateProductRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/github_com_boilerplate_microservice-boilerplate_api_http_v1_response.APIResponse-github_com_boilerplate_microservice-boilerplate_internal_product_domain_response_ProductResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/github_com_boilerplate_microservice-boilerplate_api_http_v1_response.APIResponse-github_com_boilerplate_microservice-boilerplate_api_http_v1_response_Empty'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/github_com_boilerplate_microservice-boilerplate_api_http_v1_response.APIResponse-github_com_boilerplate_microservice-boilerplate_api_http_v1_response_Empty'
      summary: Create product
      tags:
      - products
  /api/v1/products/{id}:
    delete:
      description: Deletes a product by ID and invalidates its cache entry.
      parameters:
      - description: Product UUID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "204":
          description: No Content
          schema:
            $ref: '#/definitions/github_com_boilerplate_microservice-boilerplate_api_http_v1_response.APIResponse-github_com_boilerplate_microservice-boilerplate_api_http_v1_response_Empty'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/github_com_boilerplate_microservice-boilerplate_api_http_v1_response.APIResponse-github_com_boilerplate_microservice-boilerplate_api_http_v1_response_Empty'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/github_com_boilerplate_microservice-boilerplate_api_http_v1_response.APIResponse-github_com_boilerplate_microservice-boilerplate_api_http_v1_response_Empty'
      summary: Delete product
      tags:
      - products
    get:
      description: Returns a single product identified by its UUID.
      parameters:
      - description: Product UUID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_boilerplate_microservice-boilerplate_api_http_v1_response.APIResponse-github_com_boilerplate_microservice-boilerplate_internal_product_domain_response_ProductResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/github_com_boilerplate_microservice-boilerplate_api_http_v1_response.APIResponse-github_com_boilerplate_microservice-boilerplate_api_http_v1_response_Empty'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/github_com_boilerplate_microservice-boilerplate_api_http_v1_response.APIResponse-github_com_boilerplate_microservice-boilerplate_api_http_v1_response_Empty'
      summary: Get product by ID
      tags:
      - products
    put:
      consumes:
      - application/json
      description: Updates an existing product by ID and publishes a ProductUpdated
        event.
      parameters:
      - description: Product UUID
        in: path
        name: id
        required: true
        type: string
      - description: Product payload
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/github_com_boilerplate_microservice-boilerplate_internal_product_domain_request.UpdateProductRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_boilerplate_microservice-boilerplate_api_http_v1_response.APIResponse-github_com_boilerplate_microservice-boilerplate_internal_product_domain_response_ProductResponse'
        "400":
